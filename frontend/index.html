<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Profiling</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            padding: 1.5rem 2rem;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            text-align: center;
        }
        header h1 { font-size: 1.5rem; color: #38bdf8; }
        header p { font-size: 0.85rem; color: #94a3b8; margin-top: 0.25rem; }
        main {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1.5rem;
        }
        .upload-zone {
            border: 2px dashed #475569;
            border-radius: 12px;
            padding: 3rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }
        .upload-zone p { color: #94a3b8; margin-top: 0.5rem; font-size: 0.9rem; }
        .upload-zone .icon { font-size: 2.5rem; }
        input[type="file"] { display: none; }
        .btn {
            display: inline-block;
            padding: 0.65rem 1.5rem;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #7dd3fc; }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        #file-name { margin-top: 0.75rem; color: #38bdf8; font-size: 0.85rem; }
        #progress { display: none; margin-top: 1rem; }
        .progress-bar {
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: #38bdf8;
            width: 0%;
            transition: width 0.3s;
            border-radius: 3px;
        }
        #progress p { font-size: 0.8rem; color: #94a3b8; margin-top: 0.5rem; }
        #results { display: none; }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .metric {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        .metric .value { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
        .metric .label { font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem; }
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
            font-size: 0.8rem;
        }
        th, td {
            padding: 0.5rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th { color: #94a3b8; font-weight: 500; }
        td { color: #e2e8f0; }
        .download-section {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .btn-outline {
            padding: 0.5rem 1rem;
            background: transparent;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-outline:hover { background: rgba(56, 189, 248, 0.1); }
        #error { display: none; }
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 1rem;
            color: #fca5a5;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Auto Profiling</h1>
        <p>Data Profiling y Limpieza Automatizada de CSV</p>
    </header>

    <main>
        <div class="card">
            <div class="upload-zone" id="drop-zone">
                <div class="icon">&#128206;</div>
                <p>Arrastra tu archivo CSV aqui o haz clic para seleccionar</p>
                <input type="file" id="file-input" accept=".csv">
            </div>
            <div id="file-name"></div>
            <div id="progress">
                <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>
                <p id="progress-text">Procesando...</p>
            </div>
            <div style="margin-top: 1rem; text-align: center;">
                <button class="btn" id="submit-btn" disabled>Procesar archivo</button>
            </div>
        </div>

        <div id="error">
            <div class="error-box" id="error-text"></div>
        </div>

        <div id="results" class="card">
            <h2 class="section-title" style="margin-top:0;">Resumen de Salud</h2>
            <div class="results-grid" id="health-metrics"></div>

            <h2 class="section-title">Limpieza Aplicada</h2>
            <div class="results-grid" id="cleaning-metrics"></div>

            <h2 class="section-title">Detalle por Columna</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Columna</th>
                            <th>Tipo</th>
                            <th>Nulos</th>
                            <th>% Nulos</th>
                            <th>Unicos</th>
                            <th>% Unicos</th>
                        </tr>
                    </thead>
                    <tbody id="columns-table"></tbody>
                </table>
            </div>

            <div class="download-section" id="download-section"></div>
        </div>
    </main>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileName = document.getElementById('file-name');
        const submitBtn = document.getElementById('submit-btn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const results = document.getElementById('results');
        const errorDiv = document.getElementById('error');
        const errorText = document.getElementById('error-text');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

        function handleFile(file) {
            if (!file.name.endsWith('.csv')) {
                showError('Solo se aceptan archivos .csv');
                return;
            }
            selectedFile = file;
            fileName.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            submitBtn.disabled = false;
            errorDiv.style.display = 'none';
            results.style.display = 'none';
        }

        submitBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            submitBtn.disabled = true;
            progress.style.display = 'block';
            progressFill.style.width = '30%';
            progressText.textContent = 'Subiendo archivo...';
            errorDiv.style.display = 'none';
            results.style.display = 'none';

            const form = new FormData();
            form.append('file', selectedFile);

            try {
                progressFill.style.width = '60%';
                progressText.textContent = 'Procesando profiling y limpieza...';

                const res = await fetch('/v1/profiling/process', { method: 'POST', body: form });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Error al procesar');
                }

                progressFill.style.width = '100%';
                progressText.textContent = 'Completado';

                const data = await res.json();
                renderResults(data);
            } catch (e) {
                showError(e.message);
            } finally {
                submitBtn.disabled = false;
                setTimeout(() => { progress.style.display = 'none'; progressFill.style.width = '0%'; }, 1500);
            }
        });

        function showError(msg) {
            errorText.textContent = msg;
            errorDiv.style.display = 'block';
        }

        function metric(value, label) {
            return `<div class="metric"><div class="value">${value}</div><div class="label">${label}</div></div>`;
        }

        function renderResults(data) {
            const h = data.health_summary;
            const c = data.cleaning_summary;

            document.getElementById('health-metrics').innerHTML =
                metric(h.total_rows.toLocaleString(), 'Filas') +
                metric(h.total_columns, 'Columnas') +
                metric(h.memory_usage_mb + ' MB', 'Memoria RAM') +
                metric(h.duplicate_percent + '%', 'Duplicados') +
                metric(h.total_null_percent + '%', 'Nulos Totales');

            document.getElementById('cleaning-metrics').innerHTML =
                metric(c.strings_normalized, 'Cadenas normalizadas') +
                metric(c.empty_rows_removed + ' / ' + c.empty_cols_removed, 'Filas / Cols vacias') +
                metric(c.duplicates_removed, 'Duplicados eliminados') +
                metric(c.values_coerced, 'Valores coercionados') +
                metric(c.outliers_flagged, 'Atipicos marcados') +
                metric(c.dlq_records, 'Registros DLQ');

            const tbody = document.getElementById('columns-table');
            tbody.innerHTML = h.columns.map(col =>
                `<tr>
                    <td>${col.name}</td>
                    <td>${col.dtype}</td>
                    <td>${col.null_count}</td>
                    <td>${col.null_percent}%</td>
                    <td>${col.unique_count}</td>
                    <td>${col.unique_percent}%</td>
                </tr>`
            ).join('');

            const dl = document.getElementById('download-section');
            dl.innerHTML = `<a class="btn-outline" href="${data.download_url}">Descargar CSV limpio</a>`;
            if (c.dlq_records > 0) {
                dl.innerHTML += `<a class="btn-outline" href="${data.download_url}/dlq">Descargar DLQ</a>`;
            }

            results.style.display = 'block';
        }
    </script>
</body>
</html>
