upstream profiling_backend {
    server profiling_backend:8000;
}

upstream profiling_frontend {
    server profiling_frontend:80;
}

upstream profiling_model_service {
    server profiling_model_service:8001;
}

server {
    listen 80;
    server_name _;

    # Model service requests -> model-service
    location /v1/models {
        proxy_pass http://profiling_model_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API requests -> backend
    location /v1/ {
        proxy_pass http://profiling_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check -> backend
    location /health {
        proxy_pass http://profiling_backend;
    }

    # Everything else -> frontend SPA
    location / {
        proxy_pass http://profiling_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
