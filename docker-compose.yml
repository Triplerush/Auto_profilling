services:
  redis:
    image: redis:7-alpine
    container_name: profiling_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/triplerush/auto_profiling_backend:latest}
    container_name: profiling_backend
    restart: unless-stopped
    environment:
      - PROFILING_REDIS_URL=redis://redis:6379/0
      - PROFILING_DEBUG=false
    volumes:
      - profiling_data:/tmp/profiling
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/triplerush/auto_profiling_frontend:latest}
    container_name: profiling_frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx-proxy:
    image: nginx:alpine
    container_name: profiling_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  profiling_data:
  redis_data:
