services:
  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-ghcr.io/triplerush/auto_profiling_backend:latest}
    container_name: profiling_backend
    restart: unless-stopped
    environment:
      - PROFILING_DEBUG=false
    volumes:
      - ./notebooks:/app/notebooks
      - ./results:/app/results
    networks:
      - default

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-ghcr.io/triplerush/auto_profiling_frontend:latest}
    container_name: profiling_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default

  model-service:
    build: ./model-service
    image: ${MODEL_SERVICE_IMAGE:-ghcr.io/triplerush/auto_profiling_model_service:latest}
    container_name: profiling_model_service
    restart: unless-stopped
    environment:
      - MODEL_DEBUG=false
    volumes:
      - ./results:/app/results
    networks:
      - default

  # Proxy interno que agrupa las 3 rutas del sub-proyecto.
  # NPM (en el Droplet) reenvia triplerush.tech/profiling/* a
  # profiling_proxy:3080 usando la red compartida portfolio-net.
  # El mapeo 3080:3080 permite pruebas locales sin sudo ni choques
  # con el :80 del host; en produccion NPM accede via portfolio-net.
  nginx-proxy:
    image: nginx:alpine
    container_name: profiling_proxy
    restart: unless-stopped
    ports:
      - "3080:3080"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - model-service
    networks:
      - default
      - portfolio-net

networks:
  portfolio-net:
    external: true
