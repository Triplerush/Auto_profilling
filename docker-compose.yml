services:
  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-ghcr.io/triplerush/auto_profiling_backend:latest}
    container_name: profiling_backend
    restart: unless-stopped
    environment:
      - PROFILING_DEBUG=false
    volumes:
      - ./notebooks:/app/notebooks
      - ./results:/app/results

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-ghcr.io/triplerush/auto_profiling_frontend:latest}
    container_name: profiling_frontend
    restart: unless-stopped
    depends_on:
      - backend

  model-service:
    build: ./model-service
    image: ${MODEL_SERVICE_IMAGE:-ghcr.io/triplerush/auto_profiling_model_service:latest}
    container_name: profiling_model_service
    restart: unless-stopped
    environment:
      - MODEL_DEBUG=false
    volumes:
      - ./results:/app/results

  nginx-proxy:
    image: nginx:alpine
    container_name: profiling_proxy
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - model-service
