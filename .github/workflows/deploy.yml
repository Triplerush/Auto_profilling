name: Deploy Auto Profiling to VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Obtener el nombre del repo en minúsculas
      - name: Lowercase Repository Name
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 2. Login en GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Construir y subir imagen del Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/auto_profiling_backend:latest

      # 4. Construir y subir imagen del Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/auto_profiling_frontend:latest

      # 5. Deploy al VPS via SSH (sin SCP)
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            DEPLOY_DIR="/home/${{ secrets.VPS_USERNAME }}/auto-profiling"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            # Crear carpeta de deploy
            mkdir -p "$DEPLOY_DIR"

            # Clonar repo temporal para extraer configs
            TMPDIR=$(mktemp -d)
            git clone --depth 1 "$REPO_URL" "$TMPDIR"

            # Copiar solo los archivos de orquestación
            cp "$TMPDIR/docker-compose.yml" "$DEPLOY_DIR/"
            cp -r "$TMPDIR/proxy" "$DEPLOY_DIR/"

            # Eliminar clon temporal
            rm -rf "$TMPDIR"

            # Login a GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            # Navegar al directorio de deploy
            cd "$DEPLOY_DIR"

            # Configurar imágenes inmutables
            export BACKEND_IMAGE="${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/auto_profiling_backend:latest"
            export FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/auto_profiling_frontend:latest"

            # Desplegar
            docker compose down --remove-orphans || true
            docker compose pull
            docker compose up -d

            # Limpieza del disco
            docker image prune -a -f
