name: Deploy FastAPI to VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Convertimos todo el string de github.repository a minúsculas
      # Si el user es "MiEmpresa" y repo "MiApi", fallaría sin este paso.
      - name: Lowercase Repository Name
        id: lowercase_repo
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Definir variables
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            CONTAINER_NAME="fastapi_app"

            # 2. Iniciar sesión en Docker interactuando exclusivamente con GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            # 3. Descargar la imagen recién construida
            docker pull $IMAGE

            # 4. Detener y eliminar contenedor antiguo (si existe)
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            # 5. Ejecutar el nuevo contenedor mapeando 8001 del host -> 8000 interno
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p 8001:8000 \
              $IMAGE

            # 6. Limpieza profunda: prunar las imágenes antiguas
            docker image prune -a -f
