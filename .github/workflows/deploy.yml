name: Deploy Auto Profiling to VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Copiar archivos estáticos al VPS (Ruta correcta)
      - name: Copiar archivos al VPS vía SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,frontend/"
          target: "/home/deployer/auto-profiling"

      # 2. Obtener el nombre del repo en minúsculas
      - name: Lowercase Repository Name
        id: lowercase_repo
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 3. Login en GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Construir y Subir el Backend a GHCR
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # 5. Entrar por SSH y levantar toda la orquesta
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin
            
            # ¡CORREGIDO! Navegar a la carpeta correcta
            cd /home/deployer/auto-profiling
            
            # Exportar las variables mágicas para que docker-compose las lea
            export IMAGE_PLACEHOLDER="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            export FRONTEND_PORT=80
            
            # Bajar contenedores huérfanos, actualizar imágenes y levantar todo
            docker compose down --remove-orphans || true
            docker compose pull
            docker compose up -d
            
            # Limpieza del disco duro
            docker image prune -a -f