[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-profiling-export"
version = "1.0.0"
description = "Helper library to export Jupyter notebook analyses as Data Contract JSONs"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
